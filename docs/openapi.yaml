            application/json:
              schema: { $ref: "#/components/schemas/SafetyBackupListResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/backups/safety/{backupId}:
    parameters:
      - $ref: "#/components/parameters/BackupID"
    get:
      tags: [Backups]
      summary: 查看安全备份详情
      operationId: getSafetyBackup
      x-apifox-status: designing
      responses:
        "200":
          description: Safety backup metadata and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyBackupResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/backups/safety/{backupId}/download:
    parameters:
      - $ref: "#/components/parameters/BackupID"
    get:
      tags: [Backups]
      summary: 下载安全备份
      operationId: downloadSafetyBackup
      x-apifox-status: designing
      responses:
        "200":
          description: Complete safety snapshot attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseSnapshot" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/backups/safety/{backupId}/restore:
    parameters:

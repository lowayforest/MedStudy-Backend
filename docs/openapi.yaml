openapi: 3.1.0
info:
  title: MedStudy API
  version: 1.0.0-draft
  description: >-
    MedStudy Go 后端的目标接口契约，可直接导入 Apifox 查看和调试。
    当前只有 GET /health/live 已注册到本地 HTTP 路由，其余接口仍在开发或设计中。
    时间戳统一使用 Unix 毫秒。
servers:
  - url: http://127.0.0.1:11345
    description: 本地开发
  - url: https://api-staging.medstudy.a-void.cn
    description: 规划中的测试环境
  - url: https://api.medstudy.a-void.cn
    description: 规划中的生产环境
tags:
  - name: System
  - name: Auth
  - name: Account
  - name: Bootstrap
  - name: Folders
  - name: Documents
  - name: Flashcards
  - name: Reviews
  - name: Quick quizzes
  - name: Errors
  - name: AI
  - name: Dashboard
  - name: Backups
  - name: Migration
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [System]
      summary: 存活检查
      operationId: live
      x-apifox-status: tested
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      tags: [System]
      summary: 依赖就绪检查
      operationId: ready
      x-apifox-status: designing
      security: []
      responses:
        "200":
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/version:
    get:
      tags: [System]
      summary: 查看服务版本
      operationId: getVersion
      x-apifox-status: designing
      security: []
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册并创建登录会话
      operationId: register
      x-apifox-status: developing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: demo
              password: Example!Password2026
              timezone: Asia/Shanghai
      responses:
        "201":
          description: Registered and signed in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录并创建会话
      operationId: login
      x-apifox-status: developing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: demo
              password: Example!Password2026
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌并轮换会话
      operationId: refreshSession
      x-apifox-status: developing
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Access token refreshed and refresh token rotated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录并吊销会话
      operationId: logout
      x-apifox-status: designing
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Session revoked and cookie cleared
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      tags: [Account]
      summary: 查看当前用户
      operationId: getMe
      x-apifox-status: designing
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Account]
      summary: 更新个人资料
      operationId: updateMe
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timezone]
              properties:
                timezone: { type: string, example: Asia/Shanghai }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/ai-credential:
    put:
      tags: [Account]
      summary: 保存个人 AI 密钥
      operationId: putAICredential
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, apiKey]
              properties:
                provider: { type: string, const: deepseek }
                apiKey: { type: string, minLength: 8, maxLength: 512, writeOnly: true }
      responses:
        "200":
          description: Credential encrypted and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICredentialResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Account]
      summary: 删除个人 AI 密钥
      operationId: deleteAICredential
      x-apifox-status: designing
      responses:
        "204": { description: Personal AI credential removed }
        default:
          $ref: "#/components/responses/Error"
  /api/v1/bootstrap:
    get:
      tags: [Bootstrap]
      summary: 获取前端兼容快照
      operationId: getBootstrap
      x-apifox-status: designing
      responses:
        "200":
          description: Full compatibility snapshot for the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders:
    get:
      tags: [Folders]
      summary: 查询资料夹列表
      operationId: listFolders
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/FolderType"
      responses:
        "200":
          description: Folder list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Folders]
      summary: 创建资料夹
      operationId: createFolder
      x-apifox-status: developing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
            example:
              name: 口腔解剖
              type: material
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/FolderID"
    get:
      tags: [Folders]
      summary: 查看资料夹详情
      operationId: getFolder
      x-apifox-status: designing
      responses:
        "200":
          description: Folder detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Folders]
      summary: 重命名资料夹
      operationId: updateFolder
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Folder renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Folders]
      summary: 删除资料夹
      operationId: deleteFolder
      x-apifox-status: designing
      responses:
        "204": { description: Folder and its documents deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/documents:
    get:
      tags: [Documents]
      summary: 查询文档列表
      operationId: listDocuments
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/FolderIDQuery"
        - $ref: "#/components/parameters/FolderType"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: includeContent
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Paginated documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Documents]
      summary: 根据文本创建文档
      operationId: createDocumentFromText
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Parsed text stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/documents/import:
    post:
      tags: [Documents]
      summary: 批量导入文档
      operationId: importDocuments
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [folderId, files]
              properties:
                folderId: { $ref: "#/components/schemas/UUID" }
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Per-file import results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentImportResponse" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentID"
    get:
      tags: [Documents]
      summary: 查看文档详情
      operationId: getDocument
      x-apifox-status: designing
      responses:
        "200":
          description: Document with full content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Documents]
      summary: 更新文档
      operationId: updateDocument
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Document renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Documents]
      summary: 删除文档
      operationId: deleteDocument
      x-apifox-status: designing
      responses:
        "204": { description: Document deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/flashcards:
    get:
      tags: [Flashcards]
      summary: 查询智能卡片列表
      operationId: listFlashcards
      x-apifox-status: designing
      parameters:
        - { name: due, in: query, schema: { type: boolean } }
        - { name: weak, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/FolderIDQuery"
        - { name: originType, in: query, schema: { $ref: "#/components/schemas/OriginType" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlashcardListResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/flashcards/bulk:
    post:
      tags: [Flashcards]
      summary: 批量创建智能卡片
      operationId: createFlashcards
      x-apifox-status: designing
      description: >-
        Deduplicate within the current user and within the batch. Match a complete
        originType/originId key first, then fall back to NFKC, trim, lowercase and
        whitespace-normalized front/back content. Identical normalized content is
        a duplicate even when origin keys differ.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cards]
              properties:
                cards:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/FlashcardDraft" }
      responses:
        "200":
          description: Added and deduplicated cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddFlashcardsResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/flashcards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/CardID"
    get:
      tags: [Flashcards]
      summary: 查看智能卡片详情
      operationId: getFlashcard
      x-apifox-status: designing
      responses:
        "200":
          description: Card detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlashcardResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Flashcards]
      summary: 更新智能卡片
      operationId: updateFlashcard
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                front: { type: string, minLength: 1 }
                back: { type: string, minLength: 1 }
      responses:
        "200":
          description: Card updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlashcardResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Flashcards]
      summary: 删除智能卡片
      operationId: deleteFlashcard
      x-apifox-status: designing
      responses:
        "204": { description: "Card, card reviews and error links deleted" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/flashcards/{cardId}/reviews:
    parameters:
      - $ref: "#/components/parameters/CardID"
    post:
      tags: [Reviews]
      summary: 记录智能卡片复习
      operationId: reviewFlashcard
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating]
              properties:
                rating: { $ref: "#/components/schemas/Rating" }
      responses:
        "200":
          description: SRS updated and review recorded atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlashcardReviewResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/review-history:
    get:
      tags: [Reviews]
      summary: 查询复习记录
      operationId: listReviewHistory
      x-apifox-status: designing
      parameters:
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: rating, in: query, schema: { $ref: "#/components/schemas/Rating" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Review event list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewHistoryListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Reviews]
      summary: 创建复习事件
      operationId: createReviewEvent
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewEventInput" }
      responses:
        "201":
          description: Non-flashcard review event recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewHistoryResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/quick-quizzes:
    get:
      tags: [Quick quizzes]
      summary: 查询快刷题列表
      operationId: listQuickQuizzes
      x-apifox-status: designing
      parameters:
        - { name: reviewed, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/FolderIDQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated quick quizzes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickQuizListResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/quick-quizzes/bulk:
    post:
      tags: [Quick quizzes]
      summary: 批量创建快刷题
      operationId: createQuickQuizzes
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quizzes]
              properties:
                quizzes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/QuickQuizDraft" }
      responses:
        "201":
          description: Quick quizzes created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickQuizListResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/quick-quizzes/{quizId}:
    parameters:
      - $ref: "#/components/parameters/QuizID"
    get:
      tags: [Quick quizzes]
      summary: 查看快刷题详情
      operationId: getQuickQuiz
      x-apifox-status: designing
      responses:
        "200":
          description: Quiz detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickQuizResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Quick quizzes]
      summary: 更新快刷题
      operationId: updateQuickQuiz
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickQuizUpdate" }
      responses:
        "200":
          description: Quiz updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickQuizResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Quick quizzes]
      summary: 删除快刷题
      operationId: deleteQuickQuiz
      x-apifox-status: designing
      responses:
        "204": { description: Quiz deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/quick-quizzes/{quizId}/reviews:
    parameters:
      - $ref: "#/components/parameters/QuizID"
    post:
      tags: [Quick quizzes, Reviews]
      summary: 记录快刷题练习
      operationId: reviewQuickQuiz
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rating: { $ref: "#/components/schemas/Rating" }
                createFlashcard: { type: boolean, default: false }
      responses:
        "200":
          description: Quiz marked reviewed, with optional review/card result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickQuizReviewResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/errors:
    get:
      tags: [Errors]
      summary: 查询错题列表
      operationId: listErrors
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/FolderIDQuery"
        - { name: hasFlashcard, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated error book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorQuestionListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Errors]
      summary: 新增错题
      operationId: createError
      x-apifox-status: designing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErrorQuestionInput" }
      responses:
        "201":
          description: Error question created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorQuestionResponse" }
        "200":
          description: Matching error question already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorQuestionResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/errors/actions/generate-missing-flashcards:
    post:
      tags: [Errors, AI]
      summary: 为缺少卡片的错题生成卡片
      operationId: generateMissingErrorFlashcards
      x-apifox-status: designing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                concurrency: { type: integer, minimum: 1, maximum: 3, default: 1 }
                model: { $ref: "#/components/schemas/AIModel" }
      responses:
        "200":
          description: Per-error generation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorCardResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/errors/{errorId}:
    parameters:
      - $ref: "#/components/parameters/ErrorID"
    get:
      tags: [Errors]
      summary: 查看错题详情
      operationId: getError
      x-apifox-status: designing
      responses:
        "200":
          description: Error question detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorQuestionResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Errors]
